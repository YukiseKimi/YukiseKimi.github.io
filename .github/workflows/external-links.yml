name: External links

# Checks links to other websites. Runs weekly rather than on every push,
# because other sites going down shouldn't block deploys.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Only one run per branch at a time; a newer push cancels the stale check.
concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages and build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build site
        run: swift run

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: Build
          retention-days: 1

  # Separate job on the plain runner: the Swift container has no curl,
  # which lychee-action needs to download lychee.
  check:
    name: Check external links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: Build

      # Internal links are covered by `swift test`; this only checks http(s) links.
      # --root-dir lets lychee resolve root-relative links like /tech/ in the
      # local files; without it every one is reported as an error.
      # 999 is LinkedIn's response to automated requests, 429 is rate limiting.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/Build
            --scheme https --scheme http
            --exclude '^https?://(www\.)?mannychau\.com'
            --accept '200..=299,429,999'
            'Build/**/*.html'
          fail: true
