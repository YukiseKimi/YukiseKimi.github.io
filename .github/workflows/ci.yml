name: CI

# Pull requests: build the site and run the tests.
# Pushes to main: the same, then deploy to GitHub Pages only if everything passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Linux with a pinned Swift image: starts quickly (macOS runners often
    # queue for a long time) and builds output identical to macOS.
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages and build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build site
        run: swift run

      # Also fails if a published post still contains PLACEHOLDER text.
      - name: Run tests
        run: swift test

      - name: Upload site for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: Build

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
